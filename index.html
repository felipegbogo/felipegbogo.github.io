      } catch {}
      function remember() {
        try { localStorage.setItem(preferenceKey,state.lang); } catch {}
      }
      function makeLink(link) {
        const a=document.createElement('a');a.textContent=localize(link.label);a.href=link.href;a.className='bogo-control';
        const isPdf=/\.pdf(?:[?#]|$)/i.test(link.href);
        const isDocument=isPdf||/\.(?:docx?|pptx?|xlsx?|odt|ods|odp|tex)(?:[?#]|$)/i.test(link.href)||/^docs\//i.test(link.href);
        if(isPdf)a.type='application/pdf';
        if(!/^mailto:/i.test(link.href)&&(/^https?:/i.test(link.href)||isDocument)){a.target='_blank';a.rel='noopener noreferrer';}
        return a;
      }
      function appendItems(parent,items) {
        if(!items.length)return;
        let list=null;
        for(const item of items) {
          if(item.heading){const title=document.createElement('h2');title.className='bogo-section-title';title.textContent=localize(item.heading);parent.append(title);list=null;continue;}
          if(!list){list=document.createElement('ul');list.className='bogo-list';parent.append(list);}
          const li=document.createElement('li');
          const title=document.createElement('h2');title.className='bogo-item-title';title.textContent=localize(item.title);li.append(title);
          if(item.detail){const detail=document.createElement('p');detail.className='bogo-item-detail';detail.textContent=localize(item.detail);li.append(detail);}
          if(item.links&&item.links.length){const links=document.createElement('div');links.className='bogo-item-links';links.append(...item.links.map(makeLink));li.append(links);}
          list.append(li);
        }
      }
      function render() {
        const d=text[state.lang];article.lang=state.lang==='pt'?'pt-BR':'en';document.documentElement.lang=article.lang;
        article.querySelectorAll('[data-text]').forEach(el=>{el.textContent=d[el.dataset.text];});
        article.querySelectorAll('[data-lang]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.lang===state.lang)));
        const nav=article.querySelector('.bogo-nav');nav.setAttribute('aria-label',state.lang==='pt'?'Navegação principal':'Main navigation');
        nav.replaceChildren(...pages.map((page,i)=>{const b=document.createElement('button');b.type='button';b.className='bogo-control';b.dataset.open=page;b.textContent=d.nav[i];if(page===state.page)b.setAttribute('aria-current','page');return b;}));
        article.querySelector('.bogo-home').hidden=state.page!=='home';
        article.querySelector('.bogo-profile-links').replaceChildren(...imported.homeLinks.map(link=>{const a=makeLink(link);a.classList.add('bogo-cv-button');return a;}));
        const bio=article.querySelector('.bogo-bio');bio.replaceChildren();
        for(const paragraph of localize(imported.bio).split('\n\n').filter(Boolean)){
          const p=document.createElement('p');
          for(const part of paragraph.split(/(Sérgio de Moura Almaraz|Ryuichi Fukuoka)/)){
            const link=imported.bioLinks.find(item=>item.label===part);
            p.append(link?makeLink(link):document.createTextNode(part));
          }
          bio.append(p);
        }
        const education=article.querySelector('.bogo-education');education.replaceChildren();
        const educationTitle=document.createElement('h2');educationTitle.textContent=state.lang==='pt'?'Formação e visitas':'Education and visits';education.append(educationTitle);
        const educationList=document.createElement('ul');educationList.className='bogo-education-list';
        for(const item of imported.education){const li=document.createElement('li');const dates=document.createElement('span');dates.className='bogo-education-date';dates.textContent=item.dates;const main=document.createElement('span');main.className='bogo-education-main';main.textContent=localize(item.title);const detail=document.createElement('span');detail.className='bogo-education-detail';detail.textContent=localize(item.detail);main.append(detail);li.append(dates,main);educationList.append(li);}
        education.append(educationList);
        const panel=article.querySelector('.bogo-page');panel.hidden=state.page==='home';panel.replaceChildren();
        if(state.page!=='home') {
          const label=document.createElement('div');label.className='bogo-eyebrow';label.textContent=state.page==='course'?d.courseLabel:state.page==='publications'?d.researchLabel:state.page==='notes'?d.teachingLabel:d.contactLabel;
          const title=document.createElement('h1');title.textContent=d.nav[pages.indexOf(state.page)];
          const description=document.createElement('p');description.textContent=state.page==='course'?d.courseIntro:state.page==='publications'?d.publicationsIntro:state.page==='notes'?d.notesIntro:d.contactIntro;
          const header=document.createElement('div');header.className='bogo-page-header';
          const heading=document.createElement('div');heading.className='bogo-page-heading';
          description.className='bogo-page-description';heading.append(label,title,description);header.append(heading);
          const surfaceKind={publications:'costa',notes:'torus',contact:'sphere'}[state.page];
          if(surfaceKind) {
            const figure=document.createElement('figure');figure.className='bogo-page-figure';
            if(surfaceKind==='costa') {
              const image=document.createElement('img');image.className='bogo-page-surface';
              image.src='assets/surfaces/costa.svg';image.alt=state.lang==='pt'?'Superfície mínima de Costa':'Costa minimal surface';
              image.width=420;image.height=280;image.decoding='async';figure.append(image);
            } else {
              const drawing=document.createElementNS('http://www.w3.org/2000/svg','svg');drawing.classList.add('bogo-page-surface');
              window.BogoSurfaces.draw(drawing,surfaceKind,state.lang);figure.append(drawing);
            }
            header.append(figure);
          } else header.classList.add('without-surface');
          panel.append(header);
          if(state.page==='course') {
            const lesson=window.BogoDoctrineLesson;
            const details=document.createElement('details');details.className='bogo-lesson';details.open=state.lessonOpen;
            const summary=document.createElement('summary');summary.className='bogo-lesson-summary';
            const summaryHeading=document.createElement('h2');summaryHeading.className='bogo-lesson-summary-content';
            const number=document.createElement('span');number.className='bogo-number';number.textContent='00';number.setAttribute('aria-hidden','true');
            const item=document.createElement('span');
            const name=document.createElement('span');name.className='bogo-lesson-name';name.id='lesson-zero-title';name.textContent=state.lang==='pt'?lesson.title:d.lesson;
            const small=document.createElement('small');small.className='bogo-lesson-label';small.textContent=`${d.lessonLabel} · ${d.documentLanguage}`;item.append(name,small);
            const action=document.createElement('span');action.className='bogo-lesson-action';
            const actionCopy=document.createElement('span');actionCopy.className='bogo-lesson-action-copy';
            for(const [className,label] of [['bogo-lesson-open',d.lessonOpen],['bogo-lesson-close',d.lessonClose]]){const span=document.createElement('span');span.className=className;span.textContent=label;actionCopy.append(span);}
            const icon=document.createElementNS('http://www.w3.org/2000/svg','svg');icon.classList.add('bogo-lesson-chevron');icon.setAttribute('viewBox','0 0 20 20');icon.setAttribute('aria-hidden','true');
            const chevron=document.createElementNS('http://www.w3.org/2000/svg','path');chevron.setAttribute('d','M4 7L10 13L16 7');chevron.setAttribute('fill','none');chevron.setAttribute('stroke','currentColor');chevron.setAttribute('stroke-width','1.5');icon.append(chevron);
            action.append(actionCopy,icon);summaryHeading.append(number,item,action);summary.append(summaryHeading);
            const hint=document.createElement('p');hint.className='bogo-lesson-hint';hint.id='lesson-zero-hint';hint.textContent=d.lessonReaderHint;
            const reader=document.createElement('div');reader.className='bogo-lesson-reader';reader.tabIndex=0;reader.setAttribute('role','region');reader.setAttribute('aria-labelledby',name.id);reader.setAttribute('aria-describedby',hint.id);
            const documentText=document.createElement('article');documentText.className='bogo-lesson-text';documentText.lang=lesson.language;documentText.innerHTML=lesson.html;reader.append(documentText);
            details.append(summary,hint,reader);panel.append(details);reader.scrollTop=state.lessonScroll;
            details.addEventListener('toggle',()=>{state.lessonOpen=details.open;if(details.open)reader.scrollTop=state.lessonScroll;});
            reader.addEventListener('scroll',()=>{if(details.open)state.lessonScroll=reader.scrollTop;});
          } else appendItems(panel,imported[state.page]);
        }
        const surface=article.querySelector('.bogo-surface');surface.setAttribute('aria-label',state.lang==='pt'?'Catenoide representado por curvas coordenadas':'Catenoid represented by coordinate curves');
        article.querySelector('.bogo-figure').setAttribute('aria-label',state.lang==='pt'?'Catenoide':'Catenoid');
        drawSurface();
      }
      root.addEventListener('click',e=>{
        const b=e.target.closest('button');if(!b||!root.contains(b))return;
        if(b.dataset.lang==='pt'||b.dataset.lang==='en'){state.lang=b.dataset.lang;render();remember();}
        if(pages.includes(b.dataset.open)){state.page=b.dataset.open;render();remember();}
      });
      function project(u,v) {
        const x=Math.cosh(v)*Math.cos(u),y=Math.cosh(v)*Math.sin(u),z=v,yaw=.5,tilt=.48;
        const xp=x*Math.cos(yaw)-y*Math.sin(yaw),yp=x*Math.sin(yaw)+y*Math.cos(yaw);
        return [xp,yp*Math.sin(tilt)-z*Math.cos(tilt),yp*Math.cos(tilt)+z*Math.sin(tilt)];
      }
      function drawSurface() {
        const svg=article.querySelector('.bogo-surface'),w=svg.clientWidth,h=svg.clientHeight;if(w<1||h<1)return;
        svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
        const paths=[],extent=1.28,n=Math.round(state.mesh),samples=100;
        for(let k=0;k<=n;k++){const v=-extent+2*extent*k/n;paths.push({pts:Array.from({length:samples+1},(_,i)=>project(2*Math.PI*i/samples,v)),emphasis:k===0||k===n||k===Math.round(n/2)});}
        for(let k=0;k<n*2;k++){const u=2*Math.PI*k/(n*2);paths.push({pts:Array.from({length:samples+1},(_,i)=>project(u,-extent+2*extent*i/samples)),emphasis:false});}
        let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
        for(const path of paths)for(const p of path.pts){minX=Math.min(minX,p[0]);maxX=Math.max(maxX,p[0]);minY=Math.min(minY,p[1]);maxY=Math.max(maxY,p[1]);}
        const scale=Math.min((w-14)/(maxX-minX),(h-18)/(maxY-minY)),cx=(minX+maxX)/2,cy=(minY+maxY)/2,ns='http://www.w3.org/2000/svg';
        const desc=document.createElementNS(ns,'desc');desc.textContent='X(u,v) = (cosh(v) cos(u), cosh(v) sin(u), v), −1.28 ≤ v ≤ 1.28.';
        const elements=[desc];paths.sort((a,b)=>a.pts.reduce((s,p)=>s+p[2],0)/a.pts.length-b.pts.reduce((s,p)=>s+p[2],0)/b.pts.length);
        for(const data of paths){const p=document.createElementNS(ns,'path');p.setAttribute('d',data.pts.map((v,i)=>`${i?'L':'M'}${(w/2+(v[0]-cx)*scale).toFixed(2)},${(h/2+(v[1]-cy)*scale).toFixed(2)}`).join(''));p.setAttribute('fill','none');p.setAttribute('stroke','currentColor');p.setAttribute('stroke-width',data.emphasis?'1.2':'.65');const depth=data.pts.reduce((sum,a)=>sum+a[2],0)/data.pts.length;p.setAttribute('opacity',data.emphasis?'.88':depth>0?'.68':'.25');elements.push(p);}
        svg.replaceChildren(...elements);
      }
      render();
      if('ResizeObserver' in window)new ResizeObserver(drawSurface).observe(root);
      else window.addEventListener('resize',drawSurface);
    })();
  </script>
